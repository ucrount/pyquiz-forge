services:
  pyquiz-forge:
    build:
      context: .
      args:
        # Build-time mirrors for slow networks (defaults = official mirrors).
        # Set in .env to override, e.g.:
        #   NPM_REGISTRY=https://registry.npmmirror.com
        #   PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        #   APT_MIRROR=mirrors.tuna.tsinghua.edu.cn/debian
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        APT_MIRROR: ${APT_MIRROR:-}
    image: pyquiz-forge:latest
    container_name: pyquiz-forge
    restart: unless-stopped
    ports:
      # Host:Container. Change host port if 8765 is taken.
      - "8765:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

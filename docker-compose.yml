version: "3.9"

services:
  pyquiz-forge:
    build: .
    image: pyquiz-forge:latest
    container_name: pyquiz-forge
    restart: unless-stopped
    ports:
      # Host:Container. Change host port if 8765 is taken.
      - "8765:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
